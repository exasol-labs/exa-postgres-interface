[package]
name = "exa-postgres-interface"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
default-run = "exa-postgres-interface"

[dependencies]
arrow = "58"
async-trait = "0.1"
byteorder = "1"
exarrow-rs = { version = "0.12.4", default-features = false, features = ["native"] }
futures = "0.3"
pgwire = { version = "0.39", features = ["server-api-aws-lc-rs"] }
polyglot-sql = { version = "0.3.5", default-features = false, features = ["dialect-exasol", "dialect-postgresql", "dialect-presto", "stacker", "transpile"] }
base64 = "0.22"
rand = "0.8"
regex = "1"
rpassword = "7"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rustls-pki-types = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio-postgres = "0.7"

[profile.release.package.polyglot-sql]
opt-level = 0
