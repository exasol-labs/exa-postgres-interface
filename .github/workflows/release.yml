name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Package release
        run: bash scripts/package_release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/exa-postgres-interface-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/exa-postgres-interface-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
