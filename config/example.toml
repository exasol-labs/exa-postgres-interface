[server]
# Use 127.0.0.1 for same-host testing only. Use 0.0.0.0 when PostgreSQL
# clients connect from outside the EC2 instance.
listen_host = "127.0.0.1"
listen_port = 15432
log_level = "INFO"
# Optional PostgreSQL wire-protocol TLS. Set both paths to accept PostgreSQL
# SSLRequest connections from clients that require SSL.
# tls_cert_path = "/etc/exa-postgres-interface/server.crt"
# tls_key_path = "/etc/exa-postgres-interface/server.key"

[exasol]
dsn = "example-host.example.com:8563"
encryption = true
# Recommended for self-signed Exasol Personal certificates:
# certificate_fingerprint = "SHA256_HEX_FINGERPRINT"
#
# Development-only escape hatch for local self-signed certificates. Prefer
# certificate_fingerprint when possible.
validate_certificate = true
pass_client_credentials = true
schema = ""
# Data-transport backend used to talk to Exasol. "arrow" (default) uses the
# exarrow-rs Apache Arrow driver; "websocket" uses the hand-rolled WebSocket
# JSON protocol. The choice is fixed at startup.
# transport = "arrow"

[translation]
enabled = true
# PostgreSQL-to-Exasol dialect translation runs inside the gateway by default.
# The Exasol SQL preprocessor is not required for normal operation.
#
# Optional migration fallback for deployments that still need the legacy
# database-side preprocessor:
# sql_preprocessor_script = "PG_CATALOG.PG_SQL_PREPROCESSOR"
# session_init_sql = [
#   "ALTER SESSION SET SQL_PREPROCESSOR_SCRIPT = {script}"
# ]
