<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200">

  <!-- Bridge / gateway connector between the two databases -->
  <g>
    <!-- bridge deck -->
    <rect x="108" y="86" width="164" height="16" rx="8" fill="#9AA7B0"/>
    <rect x="108" y="86" width="164" height="6" rx="3" fill="#B8C2C9"/>

    <!-- bidirectional translation arrows -->
    <path d="M 150 80 l -12 -8 l 0 5 l -22 0 l 0 6 l 22 0 l 0 5 Z" fill="#336791"/>
    <path d="M 230 80 l 12 -8 l 0 5 l 22 0 l 0 6 l -22 0 l 0 5 Z" fill="#00A854"/>
  </g>

  <!-- Left: PostgreSQL client side (blue) -->
  <g transform="translate(62, 52)">
    <path d="M -32 0 a 32 12 0 0 0 64 0 l 0 48 a 32 12 0 0 1 -64 0 Z" fill="#336791"/>
    <ellipse cx="0" cy="48" rx="32" ry="12" fill="#2A5273"/>
    <ellipse cx="0" cy="24" rx="32" ry="12" fill="none" stroke="#2A5273" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="32" ry="12" fill="#4A7FA8"/>
    <ellipse cx="0" cy="0" rx="32" ry="12" fill="none" stroke="#2A5273" stroke-width="1.5"/>
    <text x="0" y="42" font-family="Inter, sans-serif" font-size="17" font-weight="bold" fill="#E8F0F7" text-anchor="middle">PG</text>
  </g>

  <!-- Right: Exasol engine side (green) -->
  <g transform="translate(318, 52)">
    <path d="M -32 0 a 32 12 0 0 0 64 0 l 0 48 a 32 12 0 0 1 -64 0 Z" fill="#00A854"/>
    <ellipse cx="0" cy="48" rx="32" ry="12" fill="#008A44"/>
    <ellipse cx="0" cy="24" rx="32" ry="12" fill="none" stroke="#008A44" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="32" ry="12" fill="#33C47C"/>
    <ellipse cx="0" cy="0" rx="32" ry="12" fill="none" stroke="#008A44" stroke-width="1.5"/>
    <text x="0" y="42" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#E8F5E9" text-anchor="middle">EXA</text>
  </g>

  <!-- Ferris crab perched on the bridge (the Rust gateway itself) -->
  <g transform="translate(190, 70)">
    <ellipse cx="0" cy="0" rx="26" ry="18" fill="#F74C00"/>
    <ellipse cx="-7" cy="-5" rx="9" ry="6" fill="#FF8C42" opacity="0.5"/>

    <g transform="translate(-31, -12) rotate(-20)">
      <ellipse cx="0" cy="0" rx="11" ry="8" fill="#F74C00"/>
      <circle cx="-8" cy="-4" r="5.5" fill="#F74C00"/>
      <circle cx="-8" cy="4" r="5.5" fill="#F74C00"/>
    </g>
    <g transform="translate(31, -12) rotate(20)">
      <ellipse cx="0" cy="0" rx="11" ry="8" fill="#F74C00"/>
      <circle cx="8" cy="-4" r="5.5" fill="#F74C00"/>
      <circle cx="8" cy="4" r="5.5" fill="#F74C00"/>
    </g>

    <circle cx="-9" cy="-4" r="6.5" fill="white"/>
    <circle cx="9" cy="-4" r="6.5" fill="white"/>
    <circle cx="-6" cy="-4" r="3.2" fill="#222"/>
    <circle cx="12" cy="-4" r="3.2" fill="#222"/>
    <circle cx="-8" cy="-6" r="1.5" fill="white"/>
    <circle cx="10" cy="-6" r="1.5" fill="white"/>

    <path d="M -9 6 Q 0 14 9 6" stroke="#222" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <line x1="-15" y1="14" x2="-18" y2="22" stroke="#CE422B" stroke-width="4" stroke-linecap="round"/>
    <line x1="-6" y1="16" x2="-8" y2="24" stroke="#CE422B" stroke-width="4" stroke-linecap="round"/>
    <line x1="6" y1="16" x2="8" y2="24" stroke="#CE422B" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="14" x2="18" y2="22" stroke="#CE422B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title with white outline so it survives dark backgrounds -->
  <text x="190" y="160" font-family="Inter, sans-serif" font-size="22" font-weight="bold"
        fill="none" stroke="white" stroke-width="4" stroke-linejoin="round" text-anchor="middle">exa-postgres-interface</text>
  <text x="190" y="160" font-family="Inter, sans-serif" font-size="22" font-weight="bold"
        fill="#333" text-anchor="middle">exa-postgres-interface</text>
  <text x="190" y="182" font-family="Inter, sans-serif" font-size="11" font-weight="500"
        fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round" text-anchor="middle">PostgreSQL wire-protocol gateway for Exasol</text>
  <text x="190" y="182" font-family="Inter, sans-serif" font-size="11" font-weight="500"
        fill="#667" text-anchor="middle">PostgreSQL wire-protocol gateway for Exasol</text>
</svg>
